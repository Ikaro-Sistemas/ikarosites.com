name: Deploy Ikarosites to HostGator

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          security: loose
          protocol: sftp
          port: 2222
          timeout: 600000
          # Configurado para action@ikarosites.com no servidor br1160
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            INSTRUCOES_DOCKER.md
            license.txt
            .gitignore
            .dockerignore
            docker-compose.yml
            Dockerfile
            **/*.log
            wp-config.php
            wp-content/uploads/
            arquivos antes das API/
            backup/
            _backup_antigo/
            .htaccess