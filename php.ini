; cPanel-generated php ini directives, do not edit
; Manual editing of this file may result in unexpected behavior.
; To make changes to this file, use the cPanel MultiPHP INI Editor (Home >> Software >> MultiPHP INI Editor)
; For more information, read our documentation (https://go.cpanel.net/EA4ModifyINI)

; [Segurança] Oculta erros do PHP para os visitantes.
; Em desenvolvimento pode ser 'On', mas em produção deve ser 'Off' para não expor falhas.
display_errors = Off

; [Performance] Tempo máximo (em segundos) que um script pode rodar.
; 180s (3 min) é ótimo para importações do Elementor ou backups.
max_execution_time = 180
max_input_time = 180

; [Dados] Número máximo de variáveis de entrada (necessário para menus grandes no WP).
max_input_vars = 1000

; [Performance Crítica] Memória RAM alocada para o PHP.
; 512M é excelente para rodar Elementor Pro + WooCommerce sem travamentos.
memory_limit = 512M

; [Uploads] Tamanho máximo de arquivos permitidos (ex: vídeos, imagens grandes).
post_max_size = 256M
session.gc_maxlifetime = 1440
session.save_path = "/var/cpanel/php/sessions/nf-php74"
upload_max_filesize = 256M
zlib.output_compression = Off
